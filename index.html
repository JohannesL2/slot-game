<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Coffee Break</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="game-wrapper">
        <div id="game-container"></div>
    </div>

    <div class="slot-dashboard">
        <div class="slot-info">
            <div class="balance" id="balance-display">Balance: $1000</div>
            <div class="bet-info">
                <span id="bet-display">Bet: $10</span>
                <span id="lines-display">Lines: 3</span>
            </div>
        </div>

        <div class="slot-controls">
            <button class="control-btn" id="decrease-lines">- Lines</button>
            <button class="control-btn" id="increase-lines">+ Lines</button>
            <button id="spin">Spin ☕</button>
            <button class="control-btn" id="change-bet">Change Bet</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <script type="module" src="main.js"></script>
</body>
</html>
